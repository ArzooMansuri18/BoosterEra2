<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Booster Era. — Ask us anything about growing your business</title>
<style>
  :root{
    --bg: #12271f;
    --bg-deep: #0e2019;
    --panel: #16302711;
    --panel-line: #1c3b30;
    --card: #17342a;
    --card-hover: #1b3d31;
    --cream: #f4efe3;
    --cream-soft: #e9e2d2;
    --muted: #9db3a7;
    --muted-dim: #7d9689;
    --orange: #e2953f;
    --orange-soft: #e2953f22;
    --border: rgba(244,239,227,0.10);
    --border-strong: rgba(244,239,227,0.20);
    --border-orange: rgba(226,149,63,0.55);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; cursor: pointer; }
  ::selection{ background: var(--orange-soft); color: var(--cream); }

  :focus-visible{
    outline: 2px solid var(--orange);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Header ---------- */
  .site-header{
    position: sticky;
    top: 0;
    z-index: 40;
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 22px 40px;
    background: linear-gradient(to bottom, var(--bg) 70%, transparent);
  }
  .logo{
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .logo .dot{ color: var(--orange); }
  .nav{
    display:flex;
    gap: 34px;
  }
  .nav a{
    color: var(--muted);
    font-size: 15px;
    transition: color 0.2s ease;
  }
  .nav a:hover, .nav a.active{ color: var(--cream); }
  .nav-toggle{ display:none; }

  /* ---------- App shell / two panel layout ---------- */
  .app-shell{
    display: grid;
    grid-template-columns: 1.08fr 0.92fr;
    align-items: stretch;
    min-height: calc(100vh - 84px);
  }

  .panel-left{
    display:flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 48px 40px;
    gap: 40px;
  }

  .hero-block{ max-width: 620px; }
  .hero-title{
    font-size: 44px;
    line-height: 1.15;
    font-weight: 700;
    margin: 10px 0 18px;
    color: var(--cream);
    text-shadow: 1px 1px 0 rgba(226,149,63,0.18);
  }
  .hero-desc{
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    max-width: 480px;
    margin-bottom: 26px;
  }
  .suggestions{
    display:flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .chip{
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--cream-soft);
    padding: 11px 18px;
    border-radius: var(--radius-pill);
    font-size: 14px;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .chip:hover{
    border-color: var(--border-orange);
    background: var(--orange-soft);
    transform: translateY(-1px);
  }

  .chat-input-row{
    display:flex;
    align-items:center;
    gap: 12px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    border-radius: var(--radius-pill);
    padding: 8px 8px 8px 22px;
    max-width: 640px;
  }
  .chat-input-row input{
    flex:1;
    background: transparent;
    border: none;
    color: var(--cream);
    font-size: 15px;
    font-family: inherit;
  }
  .chat-input-row input::placeholder{ color: var(--muted-dim); }
  .send-btn{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--orange);
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink: 0;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .send-btn:hover{ filter: brightness(1.08); transform: translateY(-1px); }
  .send-btn svg{ width: 18px; height:18px; }

  /* ---------- Right panel: services ---------- */
  .panel-right{
    border-left: 1px solid var(--panel-line);
    padding: 28px 44px 40px;
    background: linear-gradient(180deg, rgba(255,255,255,0.012), transparent 30%);
    display:flex;
    flex-direction: column;
  }
  .panel-right-head{
    margin-bottom: 22px;
  }
  .panel-right-head h2{
    font-size: 22px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .panel-right-head p{
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }

  .service-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .service-card{
    display:flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px 16px;
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .service-card:hover, .service-card:focus-visible{
    transform: translateY(-3px) scale(1.012);
    border-color: var(--border-orange);
    background: var(--card-hover);
    box-shadow: 0 10px 24px -14px rgba(226,149,63,0.35);
  }
  .service-icon{
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(226,149,63,0.08);
    border: 1px solid var(--border);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .service-card:hover .service-icon{
    background: rgba(226,149,63,0.16);
    border-color: var(--border-orange);
  }
  .service-icon svg{ width: 19px; height: 19px; stroke: var(--orange); }
  .service-card h3{
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    color: var(--cream);
  }
  .service-card p{
    font-size: 12.5px;
    color: var(--muted);
    margin: 0;
    line-height: 1.4;
  }

  /* ---------- Live support floating button ---------- */
  .live-support-btn{
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 50;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--orange);
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 12px 28px -10px rgba(226,149,63,0.55);
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  .live-support-btn:hover{ transform: translateY(-2px) scale(1.04); filter: brightness(1.06); }
  .live-support-btn svg{ width: 24px; height: 24px; stroke: #1a1206; }
  .live-dot{
    position:absolute;
    top: 3px;
    right: 3px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f4efe3;
    border: 2px solid var(--bg);
  }
  .live-dot::after{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:50%;
    background: #3fae6a;
  }
  .live-tooltip{
    position: absolute;
    right: 74px;
    bottom: 16px;
    background: var(--card);
    border: 1px solid var(--border-strong);
    color: var(--cream);
    font-size: 13px;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    opacity: 0;
    transform: translateX(6px);
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .live-support-wrap:hover .live-tooltip{
    opacity: 1;
    transform: translateX(0);
  }
  .live-support-wrap{ position: fixed; right: 28px; bottom: 28px; z-index: 50; }
  .live-support-wrap .live-support-btn{ position: static; }

  /* ---------- Modal (Live support placeholder) ---------- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(8,16,13,0.72);
    backdrop-filter: blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.open{ opacity: 1; pointer-events: auto; }
  .modal-card{
    width: min(440px, 90vw);
    background: var(--bg-deep);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 34px 30px;
    text-align: center;
    transform: translateY(10px);
    transition: transform 0.25s ease;
  }
  .modal-overlay.open .modal-card{ transform: translateY(0); }
  .modal-icon{
    width: 56px; height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--orange-soft);
    border: 1px solid var(--border-orange);
    display:flex; align-items:center; justify-content:center;
  }
  .modal-icon svg{ width: 24px; height: 24px; stroke: var(--orange); }
  .modal-card h3{ font-size: 20px; margin: 0 0 10px; }
  .modal-card p{ color: var(--muted); font-size: 14.5px; line-height: 1.55; margin: 0 0 22px; }
  .btn-primary{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background: var(--orange);
    color: #201404;
    border: none;
    padding: 13px 26px;
    border-radius: var(--radius-pill);
    font-size: 14.5px;
    font-weight: 600;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .btn-primary:hover{ filter: brightness(1.07); transform: translateY(-1px); }
  .btn-ghost{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background: transparent;
    color: var(--cream-soft);
    border: 1px solid var(--border-strong);
    padding: 12px 24px;
    border-radius: var(--radius-pill);
    font-size: 14.5px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .btn-ghost:hover{ border-color: var(--border-orange); background: var(--orange-soft); }
  .modal-note{
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--muted-dim);
    min-height: 16px;
  }
  .modal-close{
    position:absolute;
    top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ color: var(--cream); border-color: var(--border-strong); }
  .modal-card{ position: relative; }

  /* ---------- Service page ---------- */
  .fade-in{ animation: fadeIn 0.35s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  .service-page{ padding: 10px 48px 90px; max-width: 980px; margin: 0 auto; }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 34px;
    transition: color 0.2s ease, gap 0.2s ease;
  }
  .back-link:hover{ color: var(--cream); }
  .back-link svg{ width:16px; height:16px; }

  .sp-hero{ margin-bottom: 44px; }
  .sp-eyebrow{
    color: var(--orange);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
  }
  .sp-hero h1{
    font-size: 46px;
    line-height: 1.1;
    margin: 0 0 16px;
    font-weight: 700;
  }
  .sp-hero .lede{
    font-size: 19px;
    color: var(--cream-soft);
    margin: 0 0 14px;
    max-width: 620px;
  }
  .sp-hero .support{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 600px;
    margin: 0 0 28px;
  }
  .sp-cta-row{ display:flex; gap: 14px; flex-wrap: wrap; }

  .sp-section{ margin-top: 64px; }
  .sp-section h2{ font-size: 24px; margin: 0 0 24px; font-weight: 700; }

  .why-list{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    list-style: none;
    padding: 0; margin: 0;
  }
  .why-list li{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    background: var(--card);
    font-size: 14.5px;
    color: var(--cream-soft);
  }
  .why-list li svg{ width:16px; height:16px; stroke: var(--orange); margin-top: 2px; flex-shrink:0; }

  .cards-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .info-card{
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px 18px;
    background: var(--card);
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .info-card:hover{
    transform: translateY(-3px);
    border-color: var(--border-orange);
    background: var(--card-hover);
  }
  .info-card h3{ font-size: 15.5px; margin: 0 0 8px; }
  .info-card p{ font-size: 13.5px; color: var(--muted); margin:0; line-height:1.5; }

  .steps{
    display:flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--border);
  }
  .step{
    display:flex;
    gap: 22px;
    align-items: baseline;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .step .num{
    font-size: 14px;
    color: var(--orange);
    font-weight: 700;
    width: 44px;
    flex-shrink: 0;
  }
  .step .step-text{ font-size: 15.5px; color: var(--cream-soft); }

  .cta-section{
    margin-top: 72px;
    padding: 46px 40px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    text-align: center;
    background: radial-gradient(circle at 50% 0%, rgba(226,149,63,0.08), transparent 60%);
  }
  .cta-section h2{ font-size: 26px; margin: 0 0 20px; }

  /* ---------- Generic placeholder page (careers/contact) ---------- */
  .simple-page{
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 40px 100px;
  }
  .simple-page h1{ font-size: 36px; margin: 0 0 14px; }
  .simple-page p{ color: var(--muted); font-size: 15.5px; line-height: 1.6; }

  /* ---------- Services index (visited via nav on a service page) ---------- */
  .services-index{ max-width: 980px; margin: 0 auto; padding: 10px 48px 90px; }
  .services-index h1{ font-size: 34px; margin: 6px 0 30px; }
  .services-index .service-grid{ grid-template-columns: repeat(3, 1fr); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px){
    .app-shell{ grid-template-columns: 1fr; }
    .panel-right{ border-left: none; border-top: 1px solid var(--panel-line); }
    .service-grid{ grid-template-columns: repeat(2, 1fr); }
    .cards-grid{ grid-template-columns: repeat(2, 1fr); }
    .why-list{ grid-template-columns: 1fr; }
    .services-index .service-grid{ grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px){
    .site-header{ padding: 18px 20px; }
    .nav{ gap: 18px; }
    .nav a{ font-size: 13.5px; }
    .panel-left, .panel-right{ padding: 20px 20px 32px; }
    .hero-title{ font-size: 32px; }
    .service-grid{ grid-template-columns: 1fr 1fr; }
    .chat-input-row{ max-width: 100%; }
    .service-page, .services-index{ padding: 10px 20px 70px; }
    .sp-hero h1{ font-size: 32px; }
    .cards-grid{ grid-template-columns: 1fr; }
    .live-support-wrap{ right: 16px; bottom: 16px; }
    .live-tooltip{ display: none; }
    .cta-section{ padding: 34px 20px; }
    .services-index .service-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo"><a href="#/">Booster Era<span class="dot">.</span></a></div>
  <nav class="nav">
    <a href="#/" data-nav="services" onclick="goServices(event)">Services</a>
    <a href="#/careers" data-nav="careers">Careers</a>
    <a href="#/contact" data-nav="contact">Contact</a>
  </nav>
</header>

<main id="app"></main>

<div class="live-support-wrap">
  <span class="live-tooltip">Talk to our marketing team</span>
  <button class="live-support-btn" aria-label="Open live support" onclick="openLiveSupport()">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3.5l4 3.5v-11l-4 3.5Z"/></svg>
    <span class="live-dot"></span>
  </button>
</div>

<div class="modal-overlay" id="liveModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeLiveSupport()" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3.5l4 3.5v-11l-4 3.5Z"/></svg>
    </div>
    <h3>Talk to a Marketing Expert</h3>
    <p>Connect with our marketing team through live video support.</p>
    <button class="btn-primary" onclick="startLiveSupport()">Start Live Support</button>
    <div class="modal-note" id="liveNote"></div>
  </div>
</div>

<script>
  /* ---------------------------------------------------
     Icons — small monoline SVGs, kept consistent in weight
  --------------------------------------------------- */
  const icon = {
    metaAds: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4.5"/><circle cx="16" cy="12" r="4.5"/></svg>',
    googleAds: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>',
    facebook: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 21v-8h3l.5-4H14V6.5c0-1.1.4-1.9 2-1.9h1.6V1.2C17.3 1.1 16.1 1 14.8 1 11.9 1 10 2.8 10 6v3H7v4h3v8h4Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none" style="fill:var(--orange)"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18.5 4.5 21l2.6-1.4A8 8 0 1 0 6 18.5Z"/><path d="M9 10c0 3 2 5 5 5"/></svg>',
    leadGen: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.9" fill="currentColor" style="fill:var(--orange)" stroke="none"/></svg>',
    smm: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="13" rx="2.5"/><path d="M8 20.5h8M12 17.5v3"/></svg>',
    content: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a1.5 1.5 0 0 1 1.5-1.5H16l4 4v10.5A1.5 1.5 0 0 1 18.5 20.5h-13A1.5 1.5 0 0 1 4 19.5Z"/><path d="M8 12h8M8 15.5h5"/></svg>',
    website: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9h17"/><circle cx="6.3" cy="6.7" r="0.6" fill="currentColor" style="fill:var(--muted)" stroke="none"/></svg>',
    seo: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',
    branding: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 11l7.5 9.5a1 1 0 0 0 1.5.05L20.5 12 20 3.5 12 3Z"/><circle cx="15.2" cy="7.8" r="1.4"/></svg>',

  /* ---------------------------------------------------
     Router
  --------------------------------------------------- */
  const app = document.getElementById("app");

  function render(){
    const hash = location.hash || "#/";
    const parts = hash.replace(/^#\/?/, "").split("/").filter(Boolean);

    let html = "";
    if(parts.length === 0){
      html = HomePage();
    } else if(parts[0] === "services" && parts[1]){
      html = ServicePage(parts[1]);
    } else if(parts[0] === "services"){
      html = ServicesIndexPage();
    } else if(parts[0] === "careers"){
      html = SimplePage("Careers", "We're always open to hearing from people who want their first break in marketing, design, or content. Reach out and tell us what you're good at.");
    } else if(parts[0] === "contact"){
      html = SimplePage("Contact", "Have a question about growing your business? Ask it on the homepage, or reach out directly and our team will get back to you.");
    } else {
      html = HomePage();
    }
    app.innerHTML = html;
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function goServices(e){
    e.preventDefault();
    location.hash = "#/";
    // if already home, smooth scroll to the services panel on narrow layouts
    setTimeout(() => {
      const panel = document.querySelector(".panel-right");
      if(panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 30);
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);

  /* ---------------------------------------------------
     Chat input (frontend-only, no backend wired up)
  --------------------------------------------------- */
  function fillChat(text){
    const input = document.getElementById("chatInput");
    if(input){ input.value = text; input.focus(); }
  }
  function sendChat(){
    const input = document.getElementById("chatInput");
    if(input && input.value.trim()){
      input.value = "";
      input.placeholder = "Thanks — we'll be in touch shortly...";
    }
  }

  /* ---------------------------------------------------

  function openLiveSupport(){
    document.getElementById("liveModal").classList.add("open");
    document.getElementById("liveNote").textContent = "";
  }
  function closeLiveSupport(){
    document.getElementById("liveModal").classList.remove("open");
  }
  function startLiveSupport(){
    document.getElementById("liveNote").textContent = "Live support integration coming soon.";
  }
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") closeLiveSupport();
